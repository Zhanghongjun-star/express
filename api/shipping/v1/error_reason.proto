syntax = "proto3";

package shipping.v1;

option go_package = "shunfeng-miniprogram/api/shipping/v1;v1";
option java_multiple_files = true;
option java_package = "shipping.v1";
option objc_class_prefix = "APIShippingV1";

// ErrorReason enumerates all domain-specific error codes for the shipping
// service. HTTP/gRPC mappings follow the conventions in the global constraint
// document:
//   - INVALID_ARGUMENT / bad-request → 400
//   - UNAUTHORIZED                    → 40101
//   - FORBIDDEN (account banned)     → 40302
//   - NOT_FOUND                      → 404
//   - RESOURCE_OCCUPIED (concurrency)→ 40903
//   - RATE_LIMIT_EXCEEDED            → 429
//   - INTERNAL                       → 500
enum ErrorReason {
  SHIPPING_UNSPECIFIED = 0;

  // The shipping channel requested is not available in the current region.
  SHIPPING_CHANNEL_UNAVAILABLE = 1;

  // The requested resource (locker, time slot, etc.) was not found.
  SHIPPING_NOT_FOUND = 2;

  // One or more request parameters are invalid or missing.
  SHIPPING_INVALID_ARGUMENT = 3;

  // The compartment type is incompatible with the parcel dimensions or weight.
  SHIPPING_BOX_TYPE_MISMATCH = 4;

  // No free compartments available in the selected locker.
  SHIPPING_LOCKER_FULL = 5;

  // No free compartments available for the requested box type.
  SHIPPING_BOX_TYPE_FULL = 6;

  // The selected time slot has been fully occupied by other users.
  SHIPPING_SLOT_FULL = 7;

  // Optimistic-lock conflict: the resource was updated by another request
  // before this one completed. The client should retry after refreshing
  // the resource state.
  SHIPPING_RESOURCE_OCCUPIED = 8;

  // The pickup date is out of the allowed range (today ~ day+2).
  SHIPPING_PICKUP_DATE_OUT_OF_RANGE = 9;

  // The requested channel does not support the supplied parameters
  // (e.g. pickup params for a locker channel).
  SHIPPING_PARAMS_MISMATCH = 10;

  // The user has exceeded the rate limit for this API (20 req/min per user
  // for locker / service-point queries).
  SHIPPING_RATE_LIMIT_EXCEEDED = 11;

  // Any other business-rule violation not covered above.
  SHIPPING_BUSINESS_ERROR = 12;
}
