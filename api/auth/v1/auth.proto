syntax = "proto3";

package auth.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/empty.proto";

option go_package = "shunfeng-miniprogram/api/auth/v1;v1";
option java_multiple_files = true;
option java_package = "io.grpc.examples.auth.v1";
option java_outer_classname = "AuthProto";

// AuthService exposes identity, login, token, password, and real-name auth APIs.
service AuthService {
  rpc SendVerificationCode(SendVerificationCodeRequest) returns (VerificationCodeReply) {
    option (google.api.http) = {
      post: "/api/v1/auth/verification-codes"
      body: "*"
    };
  }

  rpc Register(RegisterRequest) returns (TokenReply) {
    option (google.api.http) = {
      post: "/api/v1/auth/register"
      body: "*"
    };
  }

  rpc Login(LoginRequest) returns (TokenReply) {
    option (google.api.http) = {
      post: "/api/v1/auth/login"
      body: "*"
    };
  }

  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenReply) {
    option (google.api.http) = {
      post: "/api/v1/auth/refresh"
      body: "*"
    };
  }

  rpc Logout(LogoutRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/api/v1/auth/logout"
      body: "*"
    };
  }

  rpc ChangePassword(ChangePasswordRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      put: "/api/v1/account/password"
      body: "*"
    };
  }

  rpc SubmitRealNameAuth(SubmitRealNameAuthRequest) returns (RealNameAuthReply) {
    option (google.api.http) = {
      post: "/api/v1/users/me/real-name-auth"
      body: "*"
    };
  }

  rpc GetRealNameAuth(GetRealNameAuthRequest) returns (RealNameAuthInfo) {
    option (google.api.http) = {
      get: "/api/v1/users/me/real-name-auth"
    };
  }
}

message SendVerificationCodeRequest {
  string target = 1 [(google.api.field_behavior) = REQUIRED];
  string target_type = 2 [(google.api.field_behavior) = REQUIRED];
  string scene = 3 [(google.api.field_behavior) = REQUIRED];
}

message VerificationCodeReply {
  string verification_id = 1;
  int32 expires_in = 2;
}

message RegisterRequest {
  string phone = 1;
  string email = 2;
  string verify_code = 3 [(google.api.field_behavior) = REQUIRED];
  string password = 4 [(google.api.field_behavior) = REQUIRED];
  string device_id = 5 [(google.api.field_behavior) = REQUIRED];
}

message LoginRequest {
  string account = 1 [(google.api.field_behavior) = REQUIRED];
  string password = 2 [(google.api.field_behavior) = REQUIRED];
  string device_id = 3 [(google.api.field_behavior) = REQUIRED];
}

message TokenReply {
  int64 user_id = 1;
  string access_token = 2;
  string refresh_token = 3;
  string role = 4;
  string account_status = 5;
  int64 expires_in = 6;
}

message RefreshTokenRequest {
  string refresh_token = 1 [(google.api.field_behavior) = REQUIRED];
  string device_id = 2 [(google.api.field_behavior) = REQUIRED];
}

message RefreshTokenReply {
  string access_token = 1;
  string refresh_token = 2;
  int64 expires_in = 3;
}

message LogoutRequest {
  int64 user_id = 1 [(google.api.field_behavior) = REQUIRED];
  string access_token = 2 [(google.api.field_behavior) = REQUIRED];
  string refresh_token = 3;
  string device_id = 4 [(google.api.field_behavior) = REQUIRED];
  bool logout_all = 5;
}

message ChangePasswordRequest {
  int64 user_id = 1 [(google.api.field_behavior) = REQUIRED];
  string old_password = 2 [(google.api.field_behavior) = REQUIRED];
  string new_password = 3 [(google.api.field_behavior) = REQUIRED];
}

message SubmitRealNameAuthRequest {
  int64 user_id = 1 [(google.api.field_behavior) = REQUIRED];
  string real_name = 2 [(google.api.field_behavior) = REQUIRED];
  string id_card_no = 3 [(google.api.field_behavior) = REQUIRED];
  repeated string image_urls = 4;
}

message RealNameAuthReply {
  int64 auth_id = 1;
  string status = 2;
}

message GetRealNameAuthRequest {
  int64 user_id = 1 [(google.api.field_behavior) = REQUIRED];
}

message RealNameAuthInfo {
  int64 auth_id = 1;
  int64 user_id = 2;
  string real_name_mask = 3;
  string id_card_mask = 4;
  repeated string image_urls = 5;
  string status = 6;
  string reject_reason = 7;
}
