syntax = "proto3";

package order.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";

option go_package = "shunfeng-miniprogram/api/order/v1;v1";
option java_multiple_files = true;
option java_package = "io.grpc.examples.order.v1";
option java_outer_classname = "OrderProto";

service OrderService {
  rpc GetHistoryCount(GetHistoryCountRequest) returns (HistoryCount) {
    option (google.api.http) = {
      get: "/api/order/history/count"
    };
  }

  rpc ListHistoryRecords(ListHistoryRecordsRequest) returns (HistoryRecordSet) {
    option (google.api.http) = {
      get: "/api/order/history/list"
    };
  }

  rpc ExportHistory(ExportHistoryRequest) returns (ExportHistoryReply) {
    option (google.api.http) = {
      get: "/api/order/history/export"
    };
  }
}

message HistoryCount {
  int32 query_count_today = 1;
  int32 max_query_per_day = 2;
}

message GetHistoryCountRequest {
  int64 user_id = 1 [(google.api.field_behavior) = REQUIRED];
}

message HistoryRecord {
  int64 id = 1;
  string order_no = 2;
  string express_no = 3;
  string sender_name = 4;
  string receiver_name = 5;
  string status = 6;
  google.protobuf.Timestamp create_time = 7;
}

message HistoryRecordSet {
  repeated HistoryRecord records = 1;
  int32 total_count = 2;
  string next_page_token = 3;
}

message ListHistoryRecordsRequest {
  int64 user_id = 1 [(google.api.field_behavior) = REQUIRED];
  int32 page_size = 2;
  string page_token = 3;
}

message ExportHistoryRequest {
  int64 user_id = 1 [(google.api.field_behavior) = REQUIRED];
  repeated int64 record_ids = 2;
}

message ExportHistoryReply {
  string download_url = 1;
}
