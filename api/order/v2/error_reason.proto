syntax = "proto3";

package order.v2;

option go_package = "shunfeng-miniprogram/api/order/v2;v2";
option java_multiple_files = true;
option java_package = "io.grpc.examples.order.v2";
option java_outer_classname = "OrderErrorReasonProto";

enum ErrorReason {
  ERROR_REASON_UNSPECIFIED = 0;
  ORDER_FREIGHT_CALC_FAILED = 1;
  ORDER_FREIGHT_INVALID_ARGUMENT = 2;
}
