syntax = "proto3";

package order.v2;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";

option go_package = "shunfeng-miniprogram/api/order/v2;v2";
option java_multiple_files = true;
option java_package = "io.grpc.examples.order.v2";
option java_outer_classname = "OrderProto";

service OrderService {
  rpc EstimateFreight(EstimateFreightRequest) returns (EstimateFreightReply) {
    option (google.api.http) = {
      post: "/api/order/freight/estimate"
      body: "*"
    };
  }
}

// 运费预估请求
message EstimateFreightRequest {
  // 寄件信息
  string sender_province = 1 [(google.api.field_behavior) = REQUIRED];
  string sender_city = 2 [(google.api.field_behavior) = REQUIRED];
  string sender_area = 3;
  // 收件信息
  string receiver_province = 4 [(google.api.field_behavior) = REQUIRED];
  string receiver_city = 5 [(google.api.field_behavior) = REQUIRED];
  string receiver_area = 6;
  // 包裹参数
  double weight = 7 [(google.api.field_behavior) = REQUIRED];
  int32 length = 8;
  int32 width = 9;
  int32 height = 10;
  // 快递类型：1标快 2特快 3特惠
  int32 express_type = 11 [(google.api.field_behavior) = REQUIRED];
  // 保价金额 0=不保价
  double insure_value = 12;
}

// 运费预估返回结果
message EstimateFreightReply {
  double base_freight = 1;
  double insure_fee = 2;
  double total_price = 3;
  double calc_weight = 4;
  string tips = 5;
}
