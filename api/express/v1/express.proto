syntax = "proto3";

package express.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";
option go_package = "shunfeng-miniprogram/api/express/v1;v1";
option java_multiple_files = true;
option java_package = "io.grpc.examples.express.v1";
option java_outer_classname = "ExpressProto";

service ExpressService {
  // --- 订单搜索 ---
  rpc SearchOrders(SearchOrdersRequest) returns (SearchOrdersReply) {
    option (google.api.http) = {
      post: "/api/express/orders/search",
      body: "*"
    };
  }

  // --- 关注/取消关注 ---
  rpc FollowOrder(FollowOrderRequest) returns (FollowOrderReply) {
    option (google.api.http) = {
      post: "/api/express/orders/{id}/follow"
    };
  }

  rpc UnfollowOrder(UnfollowOrderRequest) returns (UnfollowOrderReply) {
    option (google.api.http) = {
      delete: "/api/express/orders/{id}/follow"
    };
  }

  // --- 标签 ---
  rpc SetOrderLabel(SetOrderLabelRequest) returns (SetOrderLabelReply) {
    option (google.api.http) = {
      put: "/api/express/orders/{id}/label",
      body: "*"
    };
  }

  rpc ClearOrderLabel(ClearOrderLabelRequest) returns (ClearOrderLabelReply) {
    option (google.api.http) = {
      delete: "/api/express/orders/{id}/label"
    };
  }

  rpc GetOrderLabel(GetOrderLabelRequest) returns (GetOrderLabelReply) {
    option (google.api.http) = {
      get: "/api/express/orders/{id}/label"
    };
  }

  // --- 分享 ---
  rpc CreateOrderShare(CreateOrderShareRequest) returns (CreateOrderShareReply) {
    option (google.api.http) = {
      post: "/api/express/orders/{id}/shares",
      body: "*"
    };
  }

  rpc GetOrderShare(GetOrderShareRequest) returns (GetOrderShareReply) {
    option (google.api.http) = {
      get: "/api/express/public/order-shares/{code}"
    };
  }

  // --- 消息 ---
  rpc ListUserMessages(ListUserMessagesRequest) returns (ListUserMessagesReply) {
    option (google.api.http) = {
      get: "/api/express/users/me/messages"
    };
  }

  rpc MarkMessageRead(MarkMessageReadRequest) returns (MarkMessageReadReply) {
    option (google.api.http) = {
      put: "/api/express/users/me/messages/{id}/read"
    };
  }

  rpc MarkAllMessagesRead(MarkAllMessagesReadRequest) returns (MarkAllMessagesReadReply) {
    option (google.api.http) = {
      put: "/api/express/users/me/messages/read-all"
    };
  }

  rpc DeleteUserMessage(DeleteUserMessageRequest) returns (DeleteUserMessageReply) {
    option (google.api.http) = {
      delete: "/api/express/users/me/messages/{id}"
    };
  }

  // --- 内部 gRPC（由 order-service 回调创建消息）---
  rpc CreateBusinessMessage(CreateBusinessMessageRequest) returns (CreateBusinessMessageReply);
}

// --- 搜索 ---
message SearchOrdersRequest {
  string keyword = 1 [(google.api.field_behavior) = REQUIRED];
  int32 page = 2;
  int32 page_size = 3;
}

message OrderItem {
  int64 id = 1;
  string order_no = 2;
  string express_no = 3;
  string sender_name = 4;
  string receiver_name = 5;
  string status = 6;
  bool has_followed = 7;
  string label = 8;
  google.protobuf.Timestamp create_time = 9;
}

message SearchOrdersReply {
  repeated OrderItem items = 1;
  int32 total = 2;
}

// --- 关注/取消关注 ---
message FollowOrderRequest {
  int64 id = 1 [(google.api.field_behavior) = REQUIRED];
}

message FollowOrderReply {
  bool followed = 1;
}

message UnfollowOrderRequest {
  int64 id = 1 [(google.api.field_behavior) = REQUIRED];
}

message UnfollowOrderReply {
  bool followed = 1;
}

// --- 标签 ---
message SetOrderLabelRequest {
  int64 id = 1 [(google.api.field_behavior) = REQUIRED];
  string content = 2 [(google.api.field_behavior) = REQUIRED];
}

message SetOrderLabelReply {
  string content = 1;
}

message ClearOrderLabelRequest {
  int64 id = 1 [(google.api.field_behavior) = REQUIRED];
}

message ClearOrderLabelReply {
  bool success = 1;
}

message GetOrderLabelRequest {
  int64 id = 1 [(google.api.field_behavior) = REQUIRED];
}

message GetOrderLabelReply {
  string content = 1;
  bool has_label = 2;
}

// --- 分享 ---
message CreateOrderShareRequest {
  int64 id = 1 [(google.api.field_behavior) = REQUIRED];
  int32 expire_hours = 2 [(google.api.field_behavior) = REQUIRED];
  bool show_sender = 3;
  bool show_receiver = 4;
  bool show_phone = 5;
  bool show_status = 6;
}

message CreateOrderShareReply {
  string share_code = 1;
  string share_url = 2;
  google.protobuf.Timestamp expire_at = 3;
}

message GetOrderShareRequest {
  string code = 1 [(google.api.field_behavior) = REQUIRED];
}

message GetOrderShareReply {
  int64 order_id = 1;
  string sender_name = 2;
  string receiver_name = 3;
  string phone = 4;
  string status = 5;
  string order_status = 6;
}

// --- 消息 ---
message ListUserMessagesRequest {
  string message_type = 1;
  string read_status = 2;
  int32 page = 3 [(google.api.field_behavior) = REQUIRED];
  int32 page_size = 4;
}

message UserMessageItem {
  int64 id = 1;
  string message_type = 2;
  string title = 3;
  string content = 4;
  string business_type = 5;
  string business_id = 6;
  int32 priority = 7;
  bool is_read = 8;
  google.protobuf.Timestamp read_at = 9;
  google.protobuf.Timestamp created_at = 10;
}

message ListUserMessagesReply {
  repeated UserMessageItem items = 1;
  int32 total = 2;
  int32 unread_count = 3;
}

message MarkMessageReadRequest {
  int64 id = 1 [(google.api.field_behavior) = REQUIRED];
}

message MarkMessageReadReply {
  bool success = 1;
  int32 unread_count = 2;
}

message MarkAllMessagesReadRequest {
}

message MarkAllMessagesReadReply {
  int32 updated_count = 1;
  int32 unread_count = 2;
}

message DeleteUserMessageRequest {
  int64 id = 1 [(google.api.field_behavior) = REQUIRED];
}

message DeleteUserMessageReply {
  bool success = 1;
  int32 unread_count = 2;
}

// --- 内部 gRPC: order-service 回调创建消息 ---
message CreateBusinessMessageRequest {
  int64 user_id = 1;
  string business_type = 2;
  string business_id = 3;
  string message_type = 4;
  string title = 5;
  string content = 6;
}

message CreateBusinessMessageReply {
  bool success = 1;
}
