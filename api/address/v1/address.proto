syntax = "proto3";

package address.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option go_package = "shunfeng-miniprogram/api/address/v1;v1";
option java_multiple_files = true;
option java_package = "io.grpc.examples.address.v1";
option java_outer_classname = "AddressProto";

service AddressService {
  rpc ListAddresses(ListAddressesRequest) returns (AddressSet) {
    option (google.api.http) = {
      get: "/v1/user/address/list"
    };
  }

  rpc CreateAddress(CreateAddressRequest) returns (Address) {
    option (google.api.http) = {
      post: "/v1/user/address/add"
      body: "address"
    };
  }

  rpc UpdateAddress(UpdateAddressRequest) returns (Address) {
    option (google.api.http) = {
      put: "/v1/user/address/edit/{address.id}"
      body: "address"
    };
  }

  rpc DeleteAddress(DeleteAddressRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/v1/user/address/{id}"
    };
  }

  rpc BatchDeleteAddresses(BatchDeleteAddressesRequest) returns (BatchDeleteAddressesReply) {
    option (google.api.http) = {
      post: "/v1/user/address/batch/del"
      body: "*"
    };
  }

  rpc ParseAddress(ParseAddressRequest) returns (ParseAddressReply) {
    option (google.api.http) = {
      post: "/v1/user/address/ai/parse"
      body: "*"
    };
  }
}

enum AddressType {
  ADDRESS_TYPE_UNSPECIFIED = 0;
  ADDRESS_TYPE_MAINLAND = 1;
  ADDRESS_TYPE_HK_MO_TW = 2;
  ADDRESS_TYPE_INTERNATIONAL = 3;
}

message Address {
  int64 id = 1;
  int64 user_id = 2;
  AddressType addr_type = 3;
  string receiver_name = 4;
  string receiver_phone = 5;
  string province = 6;
  string city = 7;
  string district = 8;
  string detail_addr = 9;
  bool is_default = 10;
  google.protobuf.Timestamp create_time = 11;
  google.protobuf.Timestamp update_time = 12;
  bool del_flag = 13;
}

message AddressSet {
  repeated Address addresses = 1;
  string next_page_token = 2;
}

message CreateAddressRequest {
  Address address = 1 [(google.api.field_behavior) = REQUIRED];
}

message UpdateAddressRequest {
  Address address = 1 [(google.api.field_behavior) = REQUIRED];
  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = REQUIRED];
}

message ListAddressesRequest {
  int64 user_id = 1 [(google.api.field_behavior) = REQUIRED];
  AddressType addr_type = 2;
  int32 page_size = 3;
  string page_token = 4;
}

message DeleteAddressRequest {
  int64 user_id = 1 [(google.api.field_behavior) = REQUIRED];
  int64 id = 2 [(google.api.field_behavior) = REQUIRED];
}

message BatchDeleteAddressesRequest {
  int64 user_id = 1 [(google.api.field_behavior) = REQUIRED];
  repeated int64 ids = 2 [(google.api.field_behavior) = REQUIRED];
}

message BatchDeleteAddressesReply {
  int32 deleted_count = 1;
}

message ParseAddressRequest {
  string content = 1 [(google.api.field_behavior) = REQUIRED];
}

message ParseAddressReply {
  Address address = 1;
}
