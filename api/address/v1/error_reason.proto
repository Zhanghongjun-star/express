syntax = "proto3";

package address.v1;

option go_package = "shunfeng-miniprogram/api/address/v1;v1";
option java_multiple_files = true;
option java_package = "io.grpc.examples.address.v1";
option java_outer_classname = "AddressErrorReasonProto";

enum ErrorReason {
  ERROR_REASON_UNSPECIFIED = 0;
  ADDRESS_NOT_FOUND = 1;
  ADDRESS_INVALID_ARGUMENT = 2;
  ADDRESS_PARSE_FAILED = 3;
}
