syntax = "proto3";

package user.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

option go_package = "shunfeng-miniprogram/api/user/v1;v1";
option java_multiple_files = true;
option java_package = "io.grpc.examples.user.v1";
option java_outer_classname = "UserProto";

service UserService {
  rpc GetProfile(GetProfileRequest) returns (Profile) {
    option (google.api.http) = {
      get: "/api/user/profile"
    };
  }

  rpc UpdateAvatar(UpdateAvatarRequest) returns (Profile) {
    option (google.api.http) = {
      put: "/api/user/profile/avatar"
      body: "*"
    };
  }

  rpc UpdateNickname(UpdateNicknameRequest) returns (Profile) {
    option (google.api.http) = {
      put: "/api/user/profile/nickname"
      body: "*"
    };
  }

  rpc GetAuthStatus(GetAuthStatusRequest) returns (AuthStatus) {
    option (google.api.http) = {
      get: "/api/user/auth/status"
    };
  }

  rpc GetAccountStatus(GetAccountStatusRequest) returns (AccountStatusInfo) {
    option (google.api.http) = {
      get: "/api/user/account/status"
    };
  }
}

message Profile {
  int64 user_id = 1;
  string avatar_url = 2;
  string nick_name = 3;
  string phone = 4;
  int32 real_name_auth = 5;
  int32 account_status = 6;
  bool is_enterprise = 7;
  int32 query_count_today = 8;
  google.protobuf.Timestamp create_time = 9;
  google.protobuf.Timestamp update_time = 10;
}

message GetProfileRequest {
  int64 user_id = 1 [(google.api.field_behavior) = REQUIRED];
}

message UpdateAvatarRequest {
  int64 user_id = 1 [(google.api.field_behavior) = REQUIRED];
  string avatar_url = 2 [(google.api.field_behavior) = REQUIRED];
}

message UpdateNicknameRequest {
  int64 user_id = 1 [(google.api.field_behavior) = REQUIRED];
  string nick_name = 2 [(google.api.field_behavior) = REQUIRED];
}

message AuthStatus {
  int64 user_id = 1;
  int32 real_name_auth = 2;
  string reject_reason = 3;
}

message GetAuthStatusRequest {
  int64 user_id = 1 [(google.api.field_behavior) = REQUIRED];
}

message AccountStatusInfo {
  int64 user_id = 1;
  int32 account_status = 2;
  int32 real_name_auth = 3;
  bool is_enterprise = 4;
  bool can_modify_profile = 5;
  bool can_manage_address = 6;
  bool can_query_history = 7;
  bool can_export = 8;
}

message GetAccountStatusRequest {
  int64 user_id = 1 [(google.api.field_behavior) = REQUIRED];
}
