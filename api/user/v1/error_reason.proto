syntax = "proto3";

package user.v1;

option go_package = "shunfeng-miniprogram/api/user/v1;v1";
option java_multiple_files = true;
option java_package = "io.grpc.examples.user.v1";
option java_outer_classname = "UserErrorReasonProto";

enum ErrorReason {
  ERROR_REASON_UNSPECIFIED = 0;
  USER_NOT_FOUND = 1;
  USER_INVALID_ARGUMENT = 2;
  USER_UNAUTHORIZED = 3;
  USER_FORBIDDEN = 4;
}
