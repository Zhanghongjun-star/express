            tags:
                - AddressService
            operationId: AddressService_ParseAddress
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/address.v1.ParseAddressRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/address.v1.ParseAddressReply'
    /v1/user/address/batch/del:
        post:
            tags:
                - AddressService
            operationId: AddressService_BatchDeleteAddresses
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/address.v1.BatchDeleteAddressesRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/address.v1.BatchDeleteAddressesReply'
    /v1/user/address/edit/{address.id}:
        put:
            tags:
                - AddressService
            operationId: AddressService_UpdateAddress
            parameters:
                - name: address.id
                  in: path
                  required: true
                  schema:
                    type: string
                - name: updateMask
                  in: query
                  schema:
                    type: string
                    format: field-mask
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/address.v1.Address'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/address.v1.Address'
    /v1/user/address/list:
        get:
            tags:
                - AddressService
            operationId: AddressService_ListAddresses
            parameters:
                - name: userId
                  in: query
                  schema:
                    type: string
                - name: addrType
                  in: query
                  schema:
                    type: integer
                    format: enum
                - name: pageSize
                  in: query
                  schema:
                    type: integer
                    format: int32
                - name: pageToken
                  in: query
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/address.v1.AddressSet'
    /v1/user/address/{id}:
        delete:
            tags:
                - AddressService
            operationId: AddressService_DeleteAddress
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
                - name: userId
                  in: query
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content: {}
