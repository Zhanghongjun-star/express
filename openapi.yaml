    /v1/todos/sync:
        post:
            tags:
                - TodoService
            description: "SyncTodos opens a bidirectional stream for two-way synchronization.\r\n The client sends SyncTodoRequest messages describing local changes, and\r\n the server pushes back TodoEvent messages reflecting the resulting state.\r\n The stream stays open until either side closes it."
            operationId: TodoService_SyncTodos
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/todo.v1.SyncTodoRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/todo.v1.TodoEvent'
    /v1/todos/update:
        put:
            tags:
                - TodoService
            description: "UpdateTodo applies a partial update to an existing todo item using a\r\n FieldMask. Only the fields listed in update_mask are overwritten; all\r\n other fields are left unchanged.\r\n Returns NOT_FOUND if the target todo does not exist, or\r\n INVALID_ARGUMENT if update_mask references unknown fields."
            operationId: TodoService_UpdateTodo
            parameters:
                - name: updateMask
                  in: query
                  description: "Set of field paths in todo to overwrite. Fields not listed are left\r\n unchanged. Use a single path of `*` to replace every mutable field."
                  schema:
                    type: string
                    format: field-mask
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/todo.v1.Todo'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/todo.v1.Todo'
    /v1/todos/watch:
        get:
            tags:
                - TodoService
            description: "WatchTodos opens a server-side stream that emits a TodoEvent for every\r\n create, update, or delete that matches the supplied filter and ordering.\r\n The stream remains open until the client cancels or the server terminates it."
            operationId: TodoService_WatchTodos
            parameters:
                - name: pageSize
                  in: query
                  description: "Optional. Maximum number of todo items returned in the initial snapshot\r\n before live events begin streaming."
                  schema:
                    type: integer
                    format: int32
                - name: pageToken
                  in: query
                  description: Optional. Page token used to resume from a prior snapshot.
                  schema:
                    type: string
                - name: filter
                  in: query
                  description: Optional. List filter expression. Same syntax as ListTodosRequest.filter.
                  schema:
                    type: string
                - name: orderBy
                  in: query
                  description: Optional. Order specification. Same syntax as ListTodosRequest.order_by.
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/todo.v1.TodoEvent'
