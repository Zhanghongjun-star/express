                - material
            type: object
            properties:
                material:
                    $ref: '#/components/schemas/order.v3.PackagingMaterial'
                updateMask:
                    type: string
                    format: field-mask
            description: UpdatePackagingMaterialRequest 更新包装材料请求。
        shipping.v1.BoxTypeInfo:
            type: object
            properties:
                boxType:
                    type: integer
                    description: Compartment size category.
                    format: enum
                length:
                    type: integer
                    description: Compartment interior length in centimetres.
                    format: int32
                width:
                    type: integer
                    description: Compartment interior width in centimetres.
                    format: int32
                height:
                    type: integer
                    description: Compartment interior height in centimetres.
                    format: int32
                maxWeight:
                    type: number
                    description: Maximum weight this compartment can hold, in kilograms.
                    format: double
                boxFee:
                    type: number
                    description: Extra fee charged for using this compartment type.
                    format: double
                availableCount:
                    type: integer
                    description: Number of currently free compartments of this type.
                    format: int32
                status:
                    type: integer
                    description: Current compartment status.
                    format: enum
            description: BoxTypeInfo describes a specific compartment type within a locker.
        shipping.v1.Channel:
            type: object
            properties:
                channelCode:
                    type: integer
                    description: "Enumerated channel code. The frontend MUST use this value rather than\r\n a hard-coded string."
                    format: enum
                name:
                    type: string
                    description: Human-readable channel name (e.g. "上门取件", "丰巢自提柜").
                available:
                    type: boolean
                    description: Whether the channel is available in the requested region.
                tip:
                    type: string
                    description: Clear prompt text shown when the channel is unavailable.
                extraFee:
                    type: number
                    description: Extra fee charged for this channel in the current region.
                    format: double
            description: "Channel describes a single shipping channel and its availability in the\r\n current region."
        shipping.v1.ListBoxTypesResponse:
            type: object
            properties:
                boxTypes:
                    type: array
                    items:
                        $ref: '#/components/schemas/shipping.v1.BoxTypeInfo'
                    description: "All compartment types available in this locker, each with its own\r\n size, fee, and free-count information."
        shipping.v1.ListChannelsResponse:
            type: object
            properties:
                channels:
                    type: array
                    items:
                        $ref: '#/components/schemas/shipping.v1.Channel'
                    description: "All shipping channels available (or unavailable with reason) for the\r\n requested region. Channels that are globally decommissioned are omitted."
        shipping.v1.ListLockersResponse:
            type: object
            properties:
                lockers:
                    type: array
                    items:
                        $ref: '#/components/schemas/shipping.v1.Locker'
                    description: Page of operational lockers ordered by distance ascending.
                nextPageToken:
                    type: string
                    description: "Token to retrieve the next page. Empty when all results have been\r\n returned."
        shipping.v1.ListPickupDatesResponse:
            type: object
            properties:
                pickupDates:
                    type: array
                    items:
                        $ref: '#/components/schemas/shipping.v1.PickupDate'
                    description: "Available pickup dates. Currently limited to today, tomorrow, and the\r\n day after tomorrow. Expired time slots for today are already excluded."
        shipping.v1.ListPickupTimeSlotsResponse:
            type: object
            properties:
                timeSlots:
                    type: array
                    items:
                        $ref: '#/components/schemas/shipping.v1.PickupTimeSlot'
                    description: "All time slots for the requested district+date. Slots with remaining\r\n capacity <= 0 are marked unavailable and the frontend MUST prevent\r\n the user from selecting them."
        shipping.v1.ListServicePointsResponse:
            type: object
            properties:
                servicePoints:
                    type: array
                    items:
                        $ref: '#/components/schemas/shipping.v1.ServicePoint'
                    description: Page of service points ordered by distance ascending.
                nextPageToken:
                    type: string
                    description: "Token to retrieve the next page. Empty when all results have been\r\n returned."
        shipping.v1.Locker:
            type: object
            properties:
                id:
                    type: string
                    description: Unique locker cabinet identifier.
                name:
                    type: string
                    description: Locker cabinet name displayed to the user.
                address:
                    type: string
                    description: Human-readable address of the locker location.
                latitude:
                    type: number
                    description: Latitude in WGS-84 coordinate system.
                    format: double
                longitude:
                    type: number
                    description: Longitude in WGS-84 coordinate system.
                    format: double
                distance:
                    type: number
                    description: Distance from the user's location in meters.
                    format: double
                status:
                    type: integer
                    description: "Operational status: 1 = normal, 0 = out of service / maintenance.\r\n The frontend MUST filter out lockers where status == 0."
                    format: int32
            description: Locker represents a physical locker cabinet.
        shipping.v1.PickupDate:
            type: object
            properties:
                date:
                    type: string
                    description: The date string in "YYYY-MM-DD" format.
                available:
                    type: boolean
                    description: Whether this date still has at least one available time slot.
            description: "PickupDate represents a single date that the user can select for\r\n door-pickup."
        shipping.v1.PickupTimeSlot:
            type: object
            properties:
                districtCode:
                    type: string
                    description: Administrative district code to which this slot belongs.
                pickupDate:
                    type: string
                    description: The date this slot belongs to, in "YYYY-MM-DD" format.
                slotCode:
                    type: string
                    description: Unique slot identifier within the district+date scope.
                startTime:
                    type: string
                    description: Slot start time in "HH:MM" format.
                endTime:
                    type: string
                    description: Slot end time in "HH:MM" format.
                capacity:
                    type: integer
                    description: Maximum number of reservations allowed for this slot.
                    format: int32
                reservedCount:
                    type: integer
                    description: Number of reservations already taken.
                    format: int32
                available:
                    type: boolean
                    description: "Whether the slot can still be selected (reserved_count < capacity and\r\n not expired)."
                version:
                    type: string
                    description: "Optimistic-lock version; the client MUST send this back when creating\r\n an order so the server can detect concurrent updates."
            description: PickupTimeSlot describes a single bookable time window on a given date.
        shipping.v1.ServicePoint:
            type: object
            properties:
                id:
                    type: string
                    description: Unique service-point identifier.
                name:
                    type: string
                    description: Display name of the service point.
                address:
                    type: string
                    description: Human-readable address.
                latitude:
                    type: number
                    description: Latitude in WGS-84.
                    format: double
                longitude:
                    type: number
                    description: Longitude in WGS-84.
                    format: double
                pointType:
                    type: integer
                    description: 'Point category: SF_STATION or PARTNER_STORE.'
                    format: enum
                distance:
                    type: number
                    description: Distance from the user's location in meters.
                    format: double
                status:
                    type: integer
                    description: 'Operational status: 1 = open, 0 = closed.'
                    format: int32
            description: ServicePoint represents an SF self-operated station or a partner store.
        todo.v1.SyncTodoRequest:
            type: object
            properties:
                action:
                    type: string
                    description: The operation to perform. One of `create`, `update`, or `delete`.
                todo:
                    allOf:
                        - $ref: '#/components/schemas/todo.v1.Todo'
                    description: Payload for `create` and `update` actions. Ignored for `delete`.
                id:
                    type: string
                    description: Identifier of the target todo. Required for `delete` and `update`.
                updateMask:
                    type: string
                    description: "Field mask used by `update` actions to limit which fields are overwritten.\r\n Ignored for `create` and `delete`."
                    format: field-mask
            description: "SyncTodoRequest is a single client message in the SyncTodos bidirectional\r\n stream. The action field selects which operation to perform on the server."
        todo.v1.Todo:
            type: object
            properties:
                id:
                    type: string
                    description: Server-assigned unique identifier. Read-only on create.
                title:
                    type: string
                    description: Short human-readable title.
                content:
                    type: string
                    description: Detailed description or notes for the todo item.
                completed:
                    type: boolean
                    description: Whether the todo item has been completed.
                createTime:
                    type: string
                    description: Time at which the todo item was created. Server-assigned, read-only.
                    format: date-time
                updateTime:
                    type: string
                    description: Time at which the todo item was last modified. Server-assigned, read-only.
                    format: date-time
            description: Todo is the canonical representation of a todo item.
        todo.v1.TodoEvent:
            type: object
            properties:
                action:
                    type: string
                    description: The change that occurred. One of `created`, `updated`, or `deleted`.
                todo:
                    allOf:
                        - $ref: '#/components/schemas/todo.v1.Todo'
                    description: "The todo item after the change. For `deleted` events only the id field\r\n is guaranteed to be populated."
                eventTime:
                    type: string
                    description: Time at which the change was observed by the server.
                    format: date-time
            description: "TodoEvent is a server-sent message describing a change to a todo item.\r\n It is emitted by both WatchTodos and SyncTodos streams."
        todo.v1.TodoSet:
            type: object
            properties:
                todos:
                    type: array
                    items:
                        $ref: '#/components/schemas/todo.v1.Todo'
                    description: The page of todo items in the order requested by ListTodosRequest.order_by.
                nextPageToken:
                    type: string
                    description: "Token used to retrieve the next page via ListTodosRequest.page_token.\r\n Empty when there are no more results."
            description: TodoSet is a paginated collection of todo items returned by ListTodos.
        user.v1.AccountStatusInfo:
            type: object
            properties:
                userId:
                    type: string
                accountStatus:
                    type: integer
                    format: int32
                realNameAuth:
                    type: integer
                    format: int32
                isEnterprise:
                    type: boolean
                canModifyProfile:
                    type: boolean
                canManageAddress:
                    type: boolean
                canQueryHistory:
                    type: boolean
                canExport:
                    type: boolean
        user.v1.AuthStatus:
            type: object
            properties:
                userId:
                    type: string
                realNameAuth:
                    type: integer
                    format: int32
                rejectReason:
                    type: string
        user.v1.Profile:
            type: object
            properties:
                userId:
                    type: string
                avatarUrl:
                    type: string
                nickName:
                    type: string
                phone:
                    type: string
                realNameAuth:
                    type: integer
                    format: int32
                accountStatus:
                    type: integer
                    format: int32
                isEnterprise:
                    type: boolean
                queryCountToday:
                    type: integer
                    format: int32
                createTime:
                    type: string
                    format: date-time
                updateTime:
                    type: string
                    format: date-time
        user.v1.UpdateAvatarRequest:
            required:
                - userId
                - avatarUrl
            type: object
            properties:
                userId:
                    type: string
                avatarUrl:
                    type: string
        user.v1.UpdateNicknameRequest:
            required:
                - userId
                - nickName
            type: object
            properties:
                userId:
                    type: string
                nickName:
                    type: string
tags:
    - name: AddressService
    - name: AuthService
      description: AuthService exposes identity, login, token, password, and real-name auth APIs.
    - name: OrderService
    - name: OrderService
