                - name: filter
                  in: query
                  description: "Optional. The standard list filter.\r\n Supported fields:\r\n    * `title` (i.e. `title:\"bug\"`)\r\n    * `content` (i.e. `content:\"docs\"`)\r\n    * `completed` (i.e. `completed` or `NOT completed`)\r\n    * `create_time` range (i.e. `create_time>=\"2026-01-01T00:00:00Z\"`)"
